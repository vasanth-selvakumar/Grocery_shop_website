{% load static %}
{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Checkout</h2>

  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">Delivery Address</label>
      <textarea name="address" class="form-control" rows="3" required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Payment Method</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="payment_method" value="cod" id="cod" checked onclick="toggleUPI(false)">
        <label class="form-check-label" for="cod">Cash on Delivery</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="payment_method" value="upi" id="upi" onclick="toggleUPI(true)">
        <label class="form-check-label" for="upi">UPI</label>
      </div>
    </div>

    <div id="upi-section" style="display:none;" class="mb-3 text-center">
      <p>Scan this QR and pay ₹{{ cart.total_price }}</p>
      <img src="{% static 'shop/images/upi_qr.png' %}" alt="UPI QR" width="200">
      <div class="mt-3">
        <label class="form-label">Upload Payment Screenshot</label>
        <input type="file" name="payment_screenshot" accept="image/*" class="form-control">
      </div>
    </div>

    <h4>Total: ₹{{ cart.total_price }}</h4>
    <button type="submit" class="btn btn-success">Place Order</button>
  </form>
</div>

<script>
function toggleUPI(show) {
  document.getElementById('upi-section').style.display = show ? 'block' : 'none';
}
</script>
{% endblock %}
