{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Enga Kadai - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Our Products</h2>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>
                    {% if product.image %}
                        <img src="{{ product.image.url }}" width="60">
                    {% else %}
                        No Image
                    {% endif %}
                </td>
                <td>{{ product.name }}</td>
                <td>{{ product.category.name }}</td>
                <td>₹{{ product.price }}</td>
                <td>
                    <a href="{% url 'place_order' product.id %}" class="btn btn-sm btn-success">Order Now</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="5">No products yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
