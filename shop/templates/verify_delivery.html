{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Delivery Confirmation</h2>

{% if message %}
<div class="alert alert-info">{{ message }}</div>
{% endif %}

<div class="card p-4 mb-4">
    <h5>Step 1: Send OTP to customer</h5>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="send_otp">
        <div class="mb-3">
            <label class="form-label">Order ID</label>
            <input type="text" name="order_id" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Send OTP</button>
    </form>
</div>

<div class="card p-4">
    <h5>Step 2: Verify OTP and mark delivered</h5>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="verify">
        <div class="mb-3">
            <label class="form-label">Order ID</label>
            <input type="text" name="order_id" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">OTP</label>
            <input type="text" name="otp" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Verify & Mark Delivered</button>
    </form>
</div>
{% endblock %}
