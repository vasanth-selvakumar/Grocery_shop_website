{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Place Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Order: {{ product.name }}</h3>
    <p>Price: ₹{{ product.price }}</p>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label>Quantity</label>
            <input type="number" name="quantity" min="1" value="1" class="form-control" style="width:150px;" id="quantity" onchange="updateTotal()" oninput="updateTotal()">
        </div>

        <div class="mb-3">
            <label>Delivery Address</label>
            <textarea name="address" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Payment Method</label><br>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="payment_method" value="cod" id="cod" checked onclick="updateTotal()">
                <label class="form-check-label" for="cod">Cash on Delivery (+₹5 delivery charge)</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="payment_method" value="upi" id="upi" onclick="updateTotal()">
                <label class="form-check-label" for="upi">UPI</label>
            </div>
        </div>

        <div id="upi-section" style="display:none;" class="mb-3 text-center">
            <p>Scan this QR and pay ₹<span id="upi-amount">{{ product.price }}</span></p>
            <img src="{% static 'shop/images/upi_qr.png' %}" alt="UPI QR" width="200">
            <div class="mt-3">
                <label class="form-label">Upload Payment Screenshot</label>
                <input type="file" name="payment_screenshot" accept="image/*" class="form-control">
            </div>
        </div>

        <h4>Total: ₹<span id="total-amount">{{ product.price }}</span></h4>

        <button type="submit" class="btn btn-success">Confirm Order</button>
    </form>
</div>

<script>
const price = {{ product.price }};
const deliveryCharge = 5;

function updateTotal() {
    const quantity = parseInt(document.getElementById('quantity').value) || 1;
    const isCOD = document.getElementById('cod').checked;
    const subtotal = price * quantity;
    const total = isCOD ? subtotal + deliveryCharge : subtotal;

    document.getElementById('total-amount').innerText = total.toFixed(2);
    document.getElementById('upi-amount').innerText = subtotal.toFixed(2);
    document.getElementById('upi-section').style.display = isCOD ? 'none' : 'block';
}
</script>
</body>
</html>
