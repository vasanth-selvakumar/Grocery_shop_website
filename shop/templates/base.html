{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vasanth Store</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container-fluid d-flex justify-content-between align-items-center px-3">
<a class="navbar-brand me-auto" href="{% url 'home' %}">Vasanth Store</a>
<div>
<a href="{% url 'product_list' %}" class="btn btn-outline-info me-2">🛍️ Products</a>
            {% if user.is_staff or user.is_superuser %}
<a href="{% url 'owner_dashboard' %}" class="btn btn-outline-warning me-2">📋 Dashboard</a>
<a href="{% url 'my_orders' %}" class="btn btn-outline-light me-2">📦 My Orders</a>
            {% endif %}
<a href="{% url 'view_cart' %}" class="btn btn-outline-light me-2">🛒 Cart</a>
            {% if user.is_authenticated %}
<form method="post" action="{% url 'logout' %}" class="d-inline">
    {% csrf_token %}
<button type="submit" class="btn btn-outline-danger">🚪 Logout</button>
</form>
            {% else %}
<a href="{% url 'login' %}" class="btn btn-outline-success">🔑 Login</a>
            {% endif %}
</div>
</div>
</nav>

<div class="container mt-4">
        {% block content %}
        {% endblock %}
</div>
</body>
</html>
