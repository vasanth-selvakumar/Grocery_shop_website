{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vasanth Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Vasanth Store</a>
        <div>
            {% if user.is_staff or user.is_superuser %}
            <a href="{% url 'owner_dashboard' %}" class="btn btn-outline-warning me-2">📋 Dashboard</a>
            <a href="{% url 'my_orders' %}" class="btn btn-outline-light me-2">📦 My Orders</a>
            {% endif %}
            <a href="{% url 'view_cart' %}" class="btn btn-outline-light">🛒 Cart</a>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
